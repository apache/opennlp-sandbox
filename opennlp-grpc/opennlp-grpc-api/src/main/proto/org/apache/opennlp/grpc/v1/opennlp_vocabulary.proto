syntax = "proto3";

package org.apache.opennlp.grpc.v1;

import "google/protobuf/timestamp.proto";
import "org/apache/opennlp/grpc/v1/opennlp_document.proto";

option java_multiple_files = true;
option java_outer_classname = "OpenNlpVocabularyProto";
option java_package = "org.apache.opennlp.grpc.v1";

// Imports dictionaries through discoverable format providers, learns bounded
// vocabularies from document-shaped corpus input, and exposes the resulting
// server-owned artifact. Write operations are disabled unless the operator
// configures a vocabulary artifact root.
service OpenNlpVocabularyService {
  // Lists built-in and ServiceLoader-contributed dictionary input formats.
  rpc ListDictionaryFormats(ListDictionaryFormatsRequest)
      returns (ListDictionaryFormatsResponse);

  // Lists imported dictionary artifacts that can seed a learned vocabulary.
  rpc ListDictionaries(ListDictionariesRequest)
      returns (ListDictionariesResponse);

  // Lists learned vocabulary artifacts that can seed a distillation or anchor a
  // collection's vocabulary coverage watch.
  rpc ListVocabularies(ListVocabulariesRequest)
      returns (ListVocabulariesResponse);

  // Imports one encoded dictionary. The first frame must be start and every
  // later frame must carry data. The server bounds bytes and parsed entries.
  rpc ImportDictionary(stream ImportDictionaryRequest)
      returns (DictionaryArtifactDescriptor);

  // Learns one vocabulary. The first frame must be start and every later frame
  // must carry an OpenNlpDocument whose raw_text contributes to the corpus.
  rpc LearnVocabulary(stream LearnVocabularyRequest)
      returns (VocabularyArtifactDescriptor);

  // Downloads the exact UTF-8 term-count TSV written for a vocabulary artifact.
  rpc DownloadVocabulary(DownloadVocabularyRequest)
      returns (stream VocabularyArtifactChunk);
}

// Standard dictionary encodings understood without an extension jar.
enum StandardDictionaryFormat {
  STANDARD_DICTIONARY_FORMAT_UNSPECIFIED = 0;
  // UTF-8 HEADWORD<TAB>definition, one entry per nonblank line.
  STANDARD_DICTIONARY_FORMAT_HEADWORD_DEFINITION_TSV = 1;
  // UTF-8 headwords, one entry per nonblank line.
  STANDARD_DICTIONARY_FORMAT_HEADWORD_LINES = 2;
  // The XML representation read by opennlp.tools.dictionary.Dictionary.
  STANDARD_DICTIONARY_FORMAT_OPENNLP_XML = 3;
}

// Selects a built-in format or the stable id of a ServiceLoader provider.
message DictionaryFormatSelector {
  oneof kind {
    StandardDictionaryFormat standard = 1;
    string custom = 2;
  }
}

// One available dictionary input format.
message DictionaryFormatDescriptor {
  DictionaryFormatSelector format = 1;
  string display_name = 2;
  repeated string media_types = 3;
  bool supports_definitions = 4;
  bool supports_multi_word_entries = 5;
}

message ListDictionaryFormatsRequest {}

message ListDictionaryFormatsResponse {
  repeated DictionaryFormatDescriptor formats = 1;
  // Whether write operations have an operator-configured artifact root.
  bool writes_enabled = 2;
  uint32 max_dictionary_bytes = 3;
  uint32 max_dictionary_entries = 4;
  uint32 max_corpus_documents = 5;
  uint32 max_corpus_bytes = 6;
  uint32 max_vocabulary_terms = 7;
  uint32 max_concurrent_writes = 8;
}

message ListDictionariesRequest {}

message ListDictionariesResponse {
  repeated DictionaryArtifactDescriptor dictionaries = 1;
}

message ListVocabulariesRequest {}

message ListVocabulariesResponse {
  // Published vocabularies in ascending artifact-id order.
  repeated VocabularyArtifactDescriptor vocabularies = 1;
}

// Metadata sent exactly once before dictionary bytes.
message ImportDictionaryStart {
  DictionaryFormatSelector format = 1;
  string display_name = 2;
  string provenance_summary = 3;
  optional string source_uri = 4;
  optional string license_name = 5;
  optional string license_uri = 6;
}

// One frame in a client-streamed dictionary import.
message ImportDictionaryRequest {
  oneof frame {
    ImportDictionaryStart start = 1;
    bytes data = 2;
  }
}

// One normalized dictionary stored beneath the operator-owned artifact root.
message DictionaryArtifactDescriptor {
  string artifact_id = 1;
  string display_name = 2;
  DictionaryFormatSelector format = 3;
  uint32 entry_count = 4;
  string artifact_hash = 5;
  uint32 byte_size = 6;
  string provenance_summary = 7;
  optional string source_uri = 8;
  optional string license_name = 9;
  optional string license_uri = 10;
  google.protobuf.Timestamp created_at = 11;
}

// Learning controls sent exactly once before corpus documents.
message LearnVocabularyStart {
  // Optional imported dictionary whose headwords are paired with corpus terms.
  // Empty learns vocabulary only from the supplied corpus.
  string dictionary_artifact_id = 1;
  string display_name = 2;
  uint32 min_frequency = 3;
  uint32 max_terms = 4;
  string provenance_summary = 5;
}

// One frame in a client-streamed vocabulary build.
message LearnVocabularyRequest {
  oneof frame {
    LearnVocabularyStart start = 1;
    OpenNlpDocument document = 2;
  }
}

// One immutable learned term table stored beneath the artifact root.
message VocabularyArtifactDescriptor {
  string artifact_id = 1;
  string display_name = 2;
  string dictionary_artifact_id = 3;
  uint32 term_count = 4;
  uint32 dictionary_term_count = 5;
  uint32 corpus_term_count = 6;
  uint32 min_frequency = 7;
  uint32 max_terms = 8;
  string artifact_hash = 9;
  uint32 byte_size = 10;
  string provenance_summary = 11;
  google.protobuf.Timestamp created_at = 12;
}

// One complete dictionary import in a single message. HTTP gateways accept this
// shape and compose it into the ImportDictionary client stream.
message ImportDictionaryUpload {
  ImportDictionaryStart start = 1;
  // Complete encoded dictionary bytes (base64 in protobuf JSON).
  bytes data = 2;
}

// One complete vocabulary build in a single message. HTTP gateways accept this
// shape and compose it into the LearnVocabulary client stream.
message LearnVocabularyUpload {
  LearnVocabularyStart start = 1;
  repeated OpenNlpDocument documents = 2;
}

message DownloadVocabularyRequest {
  string artifact_id = 1;
}

// One ordered piece of an exact vocabulary TSV artifact.
message VocabularyArtifactChunk {
  string artifact_id = 1;
  uint32 sequence = 2;
  bytes data = 3;
}
