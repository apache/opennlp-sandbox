# Local demonstration stack: the gRPC server plus the JSON gateway and browser
# workbench in one container. Build the repository first (mvn clean install),
# then from this directory:
#   docker compose up --build
# Open http://127.0.0.1:7072/ for the workbench; gRPC clients use
# 127.0.0.1:7071. Both ports publish to loopback only because the gateway has
# no authentication of its own.
services:
  opennlp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: opennlp-grpc-demo
    # The stack runs fully hardened: read-only root filesystem, no Linux
    # capabilities, and no privilege escalation. docker/test-image.sh asserts
    # the image keeps working under exactly these flags.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:7071:7071"
      - "127.0.0.1:7072:7072"
    volumes:
      # Persistent server-owned state. Place an optional server.properties in
      # this volume (or bind-mount one over /srv/opennlp/server.properties)
      # to configure models, search indexes, and training roots.
      - opennlp-state:/srv/opennlp

volumes:
  opennlp-state:
