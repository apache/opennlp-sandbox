# CUDA demonstration stack: the gRPC server with ONNX Runtime CUDA embeddings.
# Build the repository with the gpu flavor first (mvn clean install -Dgpu),
# point OPENNLP_GPU_MODELS at a directory holding minilm/model.onnx and
# minilm/vocab.txt, then from this directory:
#   docker compose -f docker-compose.gpu.yml up --build
# Requires the NVIDIA container runtime (nvidia-container-toolkit).
services:
  opennlp-gpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
    image: opennlp-grpc-demo:gpu
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "127.0.0.1:7071:7071"
      - "127.0.0.1:7072:7072"
    volumes:
      - opennlp-gpu-state:/srv/opennlp
      - ./config/server.properties.gpu:/srv/opennlp/server.properties:ro
      - ${OPENNLP_GPU_MODELS:?point OPENNLP_GPU_MODELS at a directory with minilm/model.onnx and minilm/vocab.txt}:/srv/opennlp/models:ro

volumes:
  opennlp-gpu-state:
