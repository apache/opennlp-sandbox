# OpenVINO demonstration stack: the standard CPU image delegating embeddings
# to an OpenVINO Model Server over the KServe v2 gRPC API. Export the fused
# text-to-vector model first:
#   cd ../../opennlp-grpc-integration-tests && ./scripts/ovms-server.sh prepare
# then from this directory:
#   docker compose -f docker-compose.openvino.yml up --build
# OVMS runs on CPU everywhere; on Intel GPU hosts switch the ovms service to
# the latest-gpu image, map /dev/dri (with the render group in group_add), and
# add --target_device HETERO:GPU,CPU so the fused tokenizer's string
# operations stay on CPU while the transformer runs on the GPU (there is no
# CUDA variant of OVMS).
services:
  ovms:
    image: openvino/model_server:latest
    command: >-
      --model_name embedder --model_path /models/embedder
      --port 9000 --rest_port 8000
    volumes:
      - ${OPENNLP_OVMS_MODELS:-~/.cache/opennlp-grpc-it-ovms-models}:/models:ro
    # The inference API stays on the internal compose network; nothing is
    # published to the host.

  opennlp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: opennlp-grpc-demo
    depends_on:
      - ovms
    # The server validates the OVMS endpoint eagerly at startup, so it retries
    # until the model server finishes loading the graph.
    restart: on-failure
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:7071:7071"
      - "127.0.0.1:7072:7072"
    volumes:
      - opennlp-openvino-state:/srv/opennlp
      - ./config/server.properties.openvino:/srv/opennlp/server.properties:ro

volumes:
  opennlp-openvino-state:
